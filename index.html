<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geekzone Jahresrückblick 2026</title>
<meta name="description" content="Der Jahresrückblick des Geekzone-Podcasts: alle Filme, Serien und Spiele 2026 – plus die Goldenen Dinos.">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="assets/site.css">
<style>
  .kpi-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem; }
  .kpi-row .card { padding: 1.25rem 1.4rem; }
  .kpi-row .num { font-size: 2.4rem; font-weight: 800; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi-row .lbl { font-size: .75rem; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-top: .45rem; }
  .kpi-row .sub2 { font-size: .82rem; color: var(--ink-3); margin-top: .3rem; line-height: 1.4; }
  @media (max-width: 860px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi-row > :first-child { grid-column: 1 / -1; } .kpi-row .num { font-size: 2rem; } }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
  @media (max-width: 760px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
  a.tile, div.tile {
    display: flex; flex-direction: column; gap: .7rem; text-decoration: none;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  a.tile:hover, a.tile:focus-visible { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 36px #6b1a8c66; outline: none; }
  .tile-head { display: flex; align-items: center; gap: .9rem; }
  .tile-head img { width: 52px; height: 52px; flex-shrink: 0; }
  .tile-head h3 { font-size: 1.3rem; font-weight: 800; color: #fff; }
  .tile-head .cnt { color: var(--ink-3); font-size: .85rem; }
  .tile p { color: var(--ink-2); font-size: .9rem; line-height: 1.5; margin: 0; }
  .tile p b { color: #fff; }
  .tile .go { margin-top: auto; color: var(--gold); font-weight: 700; font-size: .9rem; }
  div.tile { opacity: .55; }
  div.tile .go { color: var(--muted); }

  .awards-intro { color: var(--ink-2); line-height: 1.6; max-width: 62ch; }
  .awards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
  @media (max-width: 760px) { .awards { grid-template-columns: minmax(0, 1fr); } }
  .award { display: flex; flex-direction: column; gap: .55rem; }
  .award .badge { font-size: 2rem; line-height: 1; }
  .award h3 { font-size: 1.1rem; font-weight: 800; color: #fff; line-height: 1.25; }
  .award .who { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); }
  .award p { color: var(--ink-2); font-size: .92rem; line-height: 1.6; margin: 0; }
  .award q { color: #fff; font-style: italic; }
  .award q::before { content: "„"; } .award q::after { content: "“"; }
  .award .eps { margin-top: auto; padding-top: .3rem; }

  .trophies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
  @media (max-width: 760px) { .trophies { grid-template-columns: minmax(0, 1fr); } }
  .trophy { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
  .trophy .t { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
  .trophy .w { font-size: 1.15rem; font-weight: 800; color: #fff; margin: .25rem 0 .2rem; }
  .trophy .d { font-size: .85rem; color: var(--ink-2); line-height: 1.5; }
  .trophy .d b { color: var(--gold); }
</style>
</head>
<body>

<header class="hero-header">
  <a href="https://www.geekzone.de/" class="hero-logo"><img src="assets/logo.jpg" alt="Geekzone"></a>
  <div class="hero-text">
    <h1>Jahresrückblick <span class="yr" id="yr">2026</span></h1>
    <p>Vier Nerdosaurier, ein Mikrofon und viel zu viel Bildschirmzeit: Das war das Geekzone-Jahr. Hier steht alles, was wir geschaut,
      gespielt und zerredet haben, in Zahlen, Listen und völlig objektiven Preisen.</p>
    <nav class="hero-nav" aria-label="Rubriken">
      <a href="index.html" class="active" aria-current="page">Übersicht</a>
      <a href="filme.html">Filme</a>
      <a href="serien.html">Serien</a>
      <a href="spiele.html">Spiele</a>
      <a href="https://www.geekzone.de/">Podcast</a>
    </nav>
  </div>
</header>

<main id="app">
  <noscript><div class="card"><p>Diese Seite braucht JavaScript.</p></div></noscript>
</main>

<footer id="footer"></footer>

<script src="data/overview-2026.js"></script>
<script src="data/films-2026.js"></script>
<script src="data/series-2026.js"></script>
<script src="data/games-2026.js"></script>
<script>
(() => {
  const O = window.GZ_OVERVIEW, F = window.GZ_FILMS, SE = window.GZ_SERIES, GA = window.GZ_GAMES;
  const app = document.getElementById('app');
  if (!O || !F || !SE || !GA) {
    app.innerHTML = '<div class="card"><p>Daten fehlen. Bitte <code>scripts/build_overview.py</code>, <code>fetch_letterboxd.py</code>, <code>build_series.py</code> und <code>build_games.py</code> ausführen.</p></div>';
    return;
  }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v, d = 2) => v == null ? '–' : v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
  const hms = s => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const hm = s => `${Math.floor(s / 3600)}:${String(Math.round(s % 3600 / 60)).padStart(2, '0')} h`;
  const epById = Object.fromEntries(O.episodes.map(e => [e.id, e]));
  const ep = id => { const e = epById[id]; return e ? `<a class="ep-chip" href="${esc(e.url)}" target="_blank" rel="noopener" title="${esc(e.id)}: ${esc(e.title)}">${esc(e.id)}</a>` : ''; };
  const eps = ids => `<div class="eps">${ids.map(ep).join('')}</div>`;
  const avg = xs => xs.reduce((a, b) => a + b, 0) / (xs.length || 1);

  document.getElementById('yr').textContent = O.year;
  document.title = `Geekzone Jahresrückblick ${O.year}`;

  /* ---------- Kennzahlen ---------- */
  const total = O.totalSeconds, nEp = O.episodes.length;
  const longest = O.episodes.reduce((a, b) => b.duration > a.duration ? b : a);
  const shortest = O.episodes.reduce((a, b) => b.duration < a.duration ? b : a);
  const films = F.films, series = SE.series;
  const fAvg = F.stats.avgLbRating;
  const sAvg = avg(series.filter(s => s.rating != null).map(s => s.rating));
  const topFilm = films.find(f => f.slug === F.stats.lbExtremes.best[0]);
  const topSeries = series.filter(s => s.rating != null).reduce((a, b) => b.rating > a.rating ? b : a);
  const topGame = GA.games.reduce((a, b) => b.episodes.length > a.episodes.length ? b : a);

  /* ---------- Statistik-Trophäen (aus den Daten) ---------- */
  const crew = F.podcasters.filter(p => p.hasData);
  const most = crew.reduce((a, b) => b.watched > a.watched ? b : a);
  const kind = crew.reduce((a, b) => b.avgRating > a.avgRating ? b : a);
  const strict = crew.reduce((a, b) => b.avgRating < a.avgRating ? b : a);
  const crewAvg = f => { const r = Object.values(f.ratings).filter(v => v != null); return r.length ? { n: r.length, v: avg(r) } : null; };
  const scored = films.map(f => ({ f, c: crewAvg(f) })).filter(x => x.c && x.c.n >= 2);
  const foe = scored.reduce((a, b) => b.c.v < a.c.v ? b : a);
  const fav = scored.filter(x => x.c.n >= 3).reduce((a, b) => b.c.v > a.c.v || (b.c.v === a.c.v && b.c.n > a.c.n) ? b : a, { c: { v: -1, n: 0 } });
  const talked = [...films.map(f => ({ t: f.title, n: f.episodes.filter(e => e.how === 'match').length })),
                  ...series.map(s => ({ t: s.title, n: s.episodes.filter(e => e.how === 'match').length })),
                  ...GA.games.map(g => ({ t: g.title, n: g.episodes.filter(e => e.how === 'match').length }))]
                 .reduce((a, b) => b.n > a.n ? b : a);
  const men = Object.entries(O.mentions).sort((a, b) => b[1] - a[1]);
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const perMonth = O.episodes.reduce((m, e) => { const k = +e.date.slice(5, 7) - 1; m[k] = (m[k] || 0) + 1; return m; }, {});
  const maxMonth = Math.max(...Object.values(perMonth));
  const topMonths = Object.keys(perMonth).filter(k => perMonth[k] === maxMonth).map(k => MONTHS[k]);
  const g = O.gags;

  app.innerHTML = `
    <section class="kpi-row" aria-label="Das Jahr in Zahlen">
      <div class="card"><div class="num">${nEp}</div><div class="lbl">Folgen</div>
        <div class="sub2">${O.byType.WATCH} × Watch · ${O.byType.PLAY} × Play · ${O.byType.SPECIAL} × Special</div></div>
      <div class="card"><div class="num">${num(total / 3600, 1)}</div><div class="lbl">Stunden</div>
        <div class="sub2">Ø ${hm(total / nEp)} pro Folge</div></div>
      <div class="card"><div class="num">${films.length}</div><div class="lbl">Filme</div>
        <div class="sub2">Ø ${num(fAvg)} auf Letterboxd</div></div>
      <div class="card"><div class="num">${SE.shows}</div><div class="lbl">Serien</div>
        <div class="sub2">Ø ${num(sAvg)} auf Serializd</div></div>
      <div class="card"><div class="num">${GA.count}</div><div class="lbl">Spiele</div>
        <div class="sub2">in ${O.byType.PLAY} PLAY-Folgen</div></div>
    </section>

    <section class="tiles" aria-label="Rubriken">
      <a class="card tile" href="filme.html">
        <div class="tile-head"><img src="assets/icons/filme.svg" alt="" width="52" height="52"><div><h3>Filme</h3><div class="cnt">${films.length} Filme · ${F.stats.genres.length} Genres</div></div></div>
        <p>Bestbewertet: <b>${esc(topFilm.title)}</b> (${num(topFilm.lbRating)}). ${esc(most.name)} hat ${most.watched} davon gesehen.</p>
        <span class="go">Zum Filmjahr →</span>
      </a>
      <a class="card tile" href="serien.html">
        <div class="tile-head"><img src="assets/icons/serien.svg" alt="" width="52" height="52"><div><h3>Serien</h3><div class="cnt">${SE.shows} Serien · ${SE.count} Einträge</div></div></div>
        <p>Bestbewertet: <b>${esc(topSeries.title)}</b> (${num(topSeries.rating)}). Jede Serie mit Link zur Folge.</p>
        <span class="go">Zum Serienjahr →</span>
      </a>
      <a class="card tile" href="spiele.html">
        <div class="tile-head"><img src="assets/icons/spiele.svg" alt="" width="52" height="52"><div><h3>Spiele</h3><div class="cnt">${GA.count} Spiele · ${O.byType.PLAY} PLAY-Folgen</div></div></div>
        <p>Dauergast: <b>${esc(topGame.title)}</b>, besprochen in ${topGame.episodes.length} Folgen. Jedes Spiel mit Link zur Folge.</p>
        <span class="go">Zum Spielejahr →</span>
      </a>
    </section>

    <div class="section-title"><h2>Die Goldenen Dinos ${O.year}</h2></div>
    <p class="awards-intro">Die völlig objektive und streng wissenschaftliche Preisverleihung des Geekzone-Jahres.
      Alle Zitate stammen aus unseren eigenen Folgenbeschreibungen. Wir haben das so geschrieben und stehen dazu. Meistens.</p>

    <section class="awards">
      <article class="card award">
        <div class="badge" aria-hidden="true">🦖</div>
        <span class="who">Die ganze Bande</span>
        <h3>Goldener Dino für konsequente Selbstbeschreibung</h3>
        <p>Dinosaurier, Nerdosaurier, Geekosaurier, Lieblingsdinos, <q>prähistorische Echsenwesen</q>: In ${g.dinos.episodes.length} Folgentexten
          beschreibt sich die Crew selbst als Urzeitreptil. Kometeneinschläge gab es nur vereinzelt, etwa bei der Indie Fresse.</p>
        ${eps(g.dinos.episodes)}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">🩳</div>
        <span class="who">Peter</span>
        <h3>Die Goldene Strumpfhose</h3>
        <p>Noch im November heißt es, Peter <q>konnte ja bekanntlich bis vor kurzem nichtmal mit Männern in Strumpfhosen was anfangen</q>.
          Im Juli hatte er da längst seine <q>Leidenschaft für Strumpfhosen in verschiedenen Farben</q> entdeckt. Ergebnis:
          ${g.strumpfhosen.count} Strumpfhosen-Erwähnungen in ${g.strumpfhosen.episodes.length} Folgen und ein komplettes MCU-Projekt.
          Das lila Spandex-Top sitzt <q>auch nach (mehr als) 133 Folgen wie am ersten Tag</q>.</p>
        ${eps(['GZ132', 'GZ134', 'GZ136', 'GZ140'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">💥</div>
        <span class="who">Christian</span>
        <h3>Preis für Partygewalt mit Herz</h3>
        <p>${g.partygewalt.episodes.length} Folgen mit Partygewalt, ein eigener Folterwürfel unterm Bett und eine Horroctober-Vorbereitung
          <q>an einen Holzstuhl ohne Kissen gefesselt</q>. Und dann das: Seine Liebe zu fliegenden Körperteilen
          <q>endet überraschenderweise in bedingungsloser Romantik</q>. Wir sind bis heute verwirrt.</p>
        ${eps(['GZ123', 'GZ136', 'GZ139', 'GZ140'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">🔍</div>
        <span class="who">Tax</span>
        <h3>Der Goldene Pixel</h3>
        <p>Amtierender HDR-Inspektor, Pixelzähler unter <q>menschlich kaum vorstellbaren Mengen an Coffein</q>, Grashalm-Zähler und Verfasser
          einer Petition an Bethesda, weil es zur Fallout-Serie kein Spiel <q>aus diesem unseren Zeitalter</q> gibt.
          Nebenbei einstudiert: <q>Bond. Tax Bond.</q></p>
        ${eps(['GZ118', 'GZ122', 'GZ123', 'GZ133', 'GZ137'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">🍖</div>
        <span class="who">Fipps</span>
        <h3>Preis für Kulinarik und Kultur</h3>
        <p>Knabbert während der Aufnahme an Heidi Klums glasiertem Schinken, findet neben Call of Duty <q>eigentlich nur Zeit für alte deutsche
          Schlager</q>, zelebriert <q>die pure Lebensfreude</q> eines neuen Releases seines Lieblingsstudios und beschäftigt sich
          zwischendurch mit Schafen. Ein Mann mit Geschmack. Mit welchem, ist noch offen.</p>
        ${eps(['GZ120', 'GZ132', 'GZ133', 'GZ137'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">🎓</div>
        <span class="who">Namen sind der Redaktion bekannt</span>
        <h3>Nerd-Card-Nachprüfung des Jahres</h3>
        <p>Amtliche Klarstellung: <q>Entgegen aller anderslautenden Behauptungen ist Tabaluga – bisher – nie Teil des MCU gewesen.</q>
          Einige Mitglieder mussten zur Nachprüfung. Peter konnte seine Nerd-Card durch Gewaltkonsum und ein ausgewachsenes MCU-Projekt
          zumindest teilweise restaurieren.</p>
        ${eps(['GZ123', 'GZ136'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">🍺</div>
        <span class="who">Peter</span>
        <h3>Legendäres Item des Jahres</h3>
        <p>Zur Oktoberfestzeit gefunden: <q>Sexy Stimme des Festzeltbesuchers</q>, ein seltenes Objekt der Macht mit
          <q>Gleichgewicht −5, Leberkapazität +10</q>. Starke Konkurrenz kam von Tax' <q>erotisch-rauchiger Stimme</q>,
          mit der er eine ganze Folge lang verdächtig viel schweigt.</p>
        ${eps(['GZ127', 'GZ137'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">⏱️</div>
        <span class="who">${esc(longest.id)}: ${esc(longest.title)}</span>
        <h3>Überlänge mit Ansage</h3>
        <p>Längste Folge des Jahres mit ${hms(longest.duration)}, angekündigt mit <q>daher haben wir uns auch mal wieder ein wenig Überlänge getraut</q>.
          Die kürzeste (${esc(shortest.id)}, ${Math.round(shortest.duration / 60)} Minuten) hat eine Ausrede: Die Flut an Ankündigungen <q>hat uns dann doch geplättet</q>.
          Und in GZ127 waren wir sogar <q>wieder in unserem Zeitplan – nur für alle, die immer gern „zu lang“ schreien</q>.</p>
        ${eps([longest.id, shortest.id, 'GZ127'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">🙊</div>
        <span class="who">GZ125: Der Finnisher</span>
        <h3>Das Wort, das hier nicht steht</h3>
        <p>GZ125 hält laut eigener Beschreibung <q>den Rekord für die Erwähnung des Wortes</q> … nun ja. Es beginnt mit P.
          Zwei Folgen später wird der obligatorische Witz dazu nur <q>mit viel Mühe</q> verkniffen. Wir halten es wie GZ127 und verkneifen ihn uns auch.</p>
        ${eps(['GZ125', 'GZ127'])}
      </article>

      <article class="card award">
        <div class="badge" aria-hidden="true">🎃</div>
        <span class="who">Der Horroctober</span>
        <h3>Emanzipation des Jahres</h3>
        <p>Zum ersten Mal in der <q>inzwischen echt richtig langen Geschichte der Geekzone</q> wird der Horroctober nicht mehr
          <q>zwischen zwei anderen Filmen abgespeist</q>, sondern bekommt eine eigene Folge. Christian trällert den Glücksrad-Song,
          der Rest spielt Guess the Movie. Geek or Treat!</p>
        ${eps(['GZ136', 'GZ139'])}
      </article>
    </section>

    <section class="card">
      <span class="card-label">Diagnose des Jahres</span>
      <p style="color:#fff;font-size:1.15rem;font-weight:700;line-height:1.5;margin:0 0 .6rem">
        „Medienübernutzungsstörung in Kombination mit chronischer, verbaler Deprivation.“</p>
      <p class="muted" style="margin:0">Befund aus ${ep('GZ120')} · Christian nennt es <q>Rededruck</q> ${ep('GZ125')} · Die Therapie läuft alle zwei Wochen weiter.</p>
    </section>

    <section class="card">
      <span class="card-label">Statistik-Trophäen</span>
      <h2>Zahlen, die niemand braucht</h2>
      <p class="sub">Berechnet aus Letterboxd, Serializd, Backloggd und unseren Folgentexten, also unbestechlich.</p>
      <div class="trophies">
        <div class="trophy"><div class="t">Der Unermüdliche</div><div class="w">${esc(most.name)}</div>
          <div class="d"><b>${most.watched}</b> von ${films.length} Filmen der Jahresliste gesehen.</div></div>
        <div class="trophy"><div class="t">Der Gnädige</div><div class="w">${esc(kind.name)}</div>
          <div class="d">Ø <b>${num(kind.avgRating)}</b> Sterne. Wer so bewertet, hat das Kino lieb.</div></div>
        <div class="trophy"><div class="t">Der Strenge</div><div class="w">${esc(strict.name)}</div>
          <div class="d">Ø <b>${num(strict.avgRating)}</b> Sterne. Hier muss man sich Sterne verdienen.</div></div>
        <div class="trophy"><div class="t">Gemeinsamer Feind</div><div class="w">${esc(foe.f.title)}</div>
          <div class="d">Crew-Schnitt <b>${num(foe.c.v, 1)}</b> aus ${foe.c.n} Wertungen. Selten waren wir uns so einig.</div></div>
        ${fav.f ? `<div class="trophy"><div class="t">Konsens-Liebling</div><div class="w">${esc(fav.f.title)}</div>
          <div class="d">Crew-Schnitt <b>${num(fav.c.v, 1)}</b> aus ${fav.c.n} Wertungen. Darauf können sich alle einigen.</div></div>` : ''}
        <div class="trophy"><div class="t">Meistbesprochen</div><div class="w">${esc(talked.t)}</div>
          <div class="d">Thema in <b>${talked.n}</b> verschiedenen Folgen. Irgendwann ist auch mal gut.</div></div>
        <div class="trophy"><div class="t">Meisterwähnt</div><div class="w">${esc(men[0][0])}</div>
          <div class="d"><b>${men[0][1]}</b> Nennungen in den Folgentexten. ${esc(men[men.length - 1][0])} kommt auf ${men[men.length - 1][1]} und bleibt geheimnisvoll.</div></div>
        <div class="trophy"><div class="t">Sitzfleisch</div><div class="w">${num(total / 3600, 1)} Stunden</div>
          <div class="d">Das reicht für <b>${Math.floor(total / (2 * 3600))}</b> Spielfilme. Wir haben stattdessen darüber geredet.</div></div>
        <div class="trophy"><div class="t">Rekordmonat</div><div class="w">${topMonths.length > 2 ? `${topMonths.length}-faches Unentschieden` : topMonths.join(' & ')}</div>
          <div class="d">${topMonths.length > 2 ? esc(topMonths.join(', ').replace(/, ([^,]*)$/, ' und $1')) + ' mit je' : 'Je'} <b>${maxMonth}</b> Folgen.
            Versprochen in ${ep('GZ117')}: Der Januar wird <q>mehr Geekzones haben als je ein anderer Monat vor ihm</q>.${topMonths.length > 1 && topMonths.includes('Januar') ? ' Technisch gesehen: Versprechen gehalten. Exklusiv war es nicht.' : ''}</div></div>
      </div>
    </section>
  `;

  document.getElementById('footer').innerHTML = `
    Stand: ${new Date(O.generated + 'T12:00:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' })} ·
    Daten von Letterboxd, Serializd, Backloggd und dem <a href="https://www.geekzone.de/feed/mp3">Geekzone-Feed</a> ·
    <a href="https://www.geekzone.de/">geekzone.de</a>`;
})();
</script>
</body>
</html>
